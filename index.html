
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Portal</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* Screens */

.screen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: #080808;
    transition: opacity 0.4s ease;
}

.hidden {
    display: none !important;
}

/* Password screen */

.login-box {
    width: 90%;
    max-width: 370px;
    text-align: center;
}

.login-box h1 {
    font-size: 36px;
    margin-bottom: 12px;
}

.subtitle {
    color: #888;
    font-size: 14px;
    margin-bottom: 30px;
}

input {
    width: 100%;
    padding: 15px;
    background: #151515;
    border: 1px solid #333;
    border-radius: 8px;
    color: white;
    outline: none;
    font-size: 15px;
    margin-bottom: 12px;
    text-align: center;
}

input:focus {
    border-color: #777;
}

button {
    cursor: pointer;
    border: none;
    transition: 0.2s ease;
}

.enter-btn {
    width: 100%;
    padding: 14px;
    background: white;
    color: black;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
}

.enter-btn:hover {
    background: #cccccc;
    transform: translateY(-2px);
}

.error {
    color: #ff5555;
    font-size: 13px;
    margin-top: 14px;
    min-height: 16px;
}

/* Selection screen */

.menu-content {
    width: 90%;
    max-width: 550px;
    text-align: center;
}

.menu-content h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

.menu-content p {
    color: #888;
    margin-bottom: 35px;
    font-size: 14px;
}

.site-buttons {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.site-btn {
    width: 100%;
    padding: 23px;
    border-radius: 10px;
    background: #151515;
    color: white;
    border: 1px solid #292929;
    font-size: 19px;
    font-weight: bold;
}

.site-btn:hover {
    background: #222;
    border-color: #666;
    transform: translateY(-3px);
}

/* Website iframe */

#website-screen {
    display: block;
    background: black;
}

#website-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    background: white;
}

.back-btn {
    position: fixed;
    z-index: 5;
    top: 15px;
    left: 15px;
    padding: 10px 15px;
    color: white;
    background: rgba(0,0,0,0.75);
    border: 1px solid #555;
    border-radius: 7px;
    font-size: 13px;
}

.back-btn:hover {
    background: #333;
}

/* Black fade transition */

#fade {
    position: fixed;
    z-index: 100;
    inset: 0;
    background: black;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
}

#fade.active {
    opacity: 1;
    pointer-events: all;
}

</style>
</head>

<body>

<!-- BLACK TRANSITION -->
<div id="fade"></div>

<!-- PASSWORD SCREEN -->
<div id="login-screen" class="screen">

    <div class="login-box">

        <h1>Welcome</h1>

        <p class="subtitle">
            Enter the password to continue
        </p>

        <form id="login-form">

            <input
                type="password"
                id="password"
                placeholder="Enter password..."
                autocomplete="off"
            >

            <button class="enter-btn" type="submit">
                ENTER
            </button>

        </form>

        <p class="error" id="error-message"></p>

    </div>

</div>

<!-- WEBSITE SELECTION -->
<div id="menu-screen" class="screen hidden">

    <div class="menu-content">

        <h1>Select a website</h1>

        <p>Choose a website to continue</p>

        <div class="site-buttons">

            <button
                class="site-btn"
                onclick="openWebsite('monkey')"
            >
                MonkeyGG2
            </button>

            <button
                class="site-btn"
                onclick="openWebsite('ccported')"
            >
                CCPorted
            </button>

        </div>

    </div>

</div>

<!-- WEBSITE VIEWER -->
<div id="website-screen" class="screen hidden">

    <button class="back-btn" onclick="backToMenu()">
        ← Back
    </button>

    <iframe
        id="website-frame"
        src="about:blank"
        allowfullscreen
        title="Selected website"
    ></iframe>

</div>

<script>

// PASSWORD
const CORRECT_PASSWORD = "schoolmoneybelike";

// ELEMENTS
const loginScreen = document.getElementById("login-screen");
const menuScreen = document.getElementById("menu-screen");
const websiteScreen = document.getElementById("website-screen");
const passwordInput = document.getElementById("password");
const errorMessage = document.getElementById("error-message");
const fade = document.getElementById("fade");
const websiteFrame = document.getElementById("website-frame");

// FADE TRANSITION
function transition(callback) {

    fade.classList.add("active");

    setTimeout(() => {

        callback();

        setTimeout(() => {
            fade.classList.remove("active");
        }, 100);

    }, 450);
}

// PASSWORD CHECK
document.getElementById("login-form").addEventListener("submit", function(e) {

    e.preventDefault();

    if (passwordInput.value === CORRECT_PASSWORD) {

        errorMessage.textContent = "";

        transition(() => {

            loginScreen.classList.add("hidden");
            menuScreen.classList.remove("hidden");

        });

    } else {

        errorMessage.textContent = "Incorrect password. Please try again.";
        passwordInput.value = "";

    }

});

// OPEN WEBSITES
function openWebsite(site) {

    let url = "";

    if (site === "monkey") {
        url = "https://monkeyg2.netlify.app/";
    }

    if (site === "ccported") {
        url = "https://schoolported.netlify.app/";
    }

    transition(() => {

        menuScreen.classList.add("hidden");
        websiteScreen.classList.remove("hidden");

        websiteFrame.src = url;

    });

}

// BACK TO MENU
function backToMenu() {

    transition(() => {

        websiteFrame.src = "about:blank";

        websiteScreen.classList.add("hidden");
        menuScreen.classList.remove("hidden");

    });

}

</script>

</body>
</html>
