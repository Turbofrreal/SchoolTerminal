
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Terminal</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #050608;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
}

/* BACKGROUND */

.background {
    position: fixed;
    inset: 0;
    z-index: -2;
    overflow: hidden;
    background: radial-gradient(
        ellipse at 50% 45%,
        #151b22 0%,
        #080a0e 55%,
        #030405 100%
    );
}

.background::before {
    content: "";
    position: absolute;
    width: 200%;
    height: 200%;
    top: -50%;
    left: -50%;
    background: repeating-linear-gradient(
        115deg,
        transparent 0px,
        transparent 100px,
        rgba(255,255,255,0.035) 102px,
        rgba(255,255,255,0.035) 104px,
        transparent 106px,
        transparent 220px
    );
    animation: moveBackground 18s linear infinite;
}

.background::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(
        ellipse at center,
        transparent 20%,
        rgba(0,0,0,0.7) 100%
    );
}

@keyframes moveBackground {
    from { transform: translate(0, 0); }
    to { transform: translate(120px, 120px); }
}

/* SCREENS */

.screen {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
}

.hidden {
    display: none !important;
}

/* PASSWORD SCREEN */

#passwordScreen {
    position: fixed;
    inset: 0;
    z-index: 2;
}

.password-box {
    width: 100%;
    max-width: 390px;
    text-align: center;
    padding: 42px 35px;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px;
    background: rgba(18,21,26,0.82);
    backdrop-filter: blur(18px);
    box-shadow: 0 20px 80px rgba(0,0,0,0.5);
}

.password-box h1 {
    font-size: 38px;
    font-weight: 300;
    letter-spacing: 5px;
    color: #b7f7e5;
    margin-bottom: 12px;
}

.password-box p {
    color: #9299a3;
    font-size: 14px;
    margin-bottom: 30px;
}

.password-box input {
    width: 100%;
    padding: 15px;
    border: 1px solid #343b43;
    border-radius: 9px;
    background: #101419;
    color: white;
    outline: none;
    font-size: 15px;
    text-align: center;
}

.password-box input:focus {
    border-color: #9cebd5;
}

.password-box button {
    width: 100%;
    margin-top: 15px;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: #b7f7e5;
    color: #07100d;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
}

#errorMessage {
    color: #ff7777;
    font-size: 13px;
    margin-top: 15px;
    min-height: 16px;
}

/* MENU */

.header {
    text-align: center;
    margin-bottom: 55px;
}

.header h1 {
    font-size: clamp(42px, 7vw, 76px);
    font-weight: 300;
    letter-spacing: 9px;
    color: #b7f7e5;
    text-shadow: 0 0 35px rgba(183,247,229,0.15);
}

.header p {
    color: #858d98;
    font-size: 14px;
    letter-spacing: 3px;
    margin-top: 13px;
    text-transform: uppercase;
}

/* CARDS */

.cards {
    width: 100%;
    max-width: 1250px;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 24px;
    margin: 0 auto;
}

.site-card {
    position: relative;
    min-height: 330px;
    padding: 35px 28px;
    text-align: left;
    border: 1px solid rgba(255,255,255,0.11);
    border-radius: 18px;
    background: rgba(31,35,42,0.76);
    color: white;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.25s ease,
                border-color 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
    backdrop-filter: blur(12px);
}

.site-card::before {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    right: -90px;
    top: -90px;
    background: rgba(183,247,229,0.06);
    border-radius: 50%;
    transition: 0.3s;
}

.site-card:hover {
    transform: translateY(-8px);
    border-color: rgba(183,247,229,0.5);
    background: rgba(39,45,52,0.92);
    box-shadow: 0 15px 45px rgba(0,0,0,0.35);
}

.site-card:hover::before {
    transform: scale(1.5);
}

.card-icon {
    width: 90px;
    height: 90px;
    margin-bottom: 27px;
}

.card-icon svg {
    width: 100%;
    height: 100%;
}

.site-card h2 {
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 13px;
}

.site-card p {
    color: #a5abb4;
    font-size: 14px;
    line-height: 1.7;
    min-height: 48px;
}

.card-label {
    display: inline-block;
    margin-top: 25px;
    color: #b7f7e5;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 0.5px;
}

/* FOOTER */

.footer {
    margin-top: 45px;
    color: #535b65;
    font-size: 11px;
    letter-spacing: 2px;
    text-align: center;
}

/* FADE */

#fadeOverlay {
    position: fixed;
    inset: 0;
    background: black;
    opacity: 0;
    pointer-events: none;
    z-index: 100;
    transition: opacity 0.45s ease;
}

#fadeOverlay.active {
    opacity: 1;
    pointer-events: all;
}

/* MOBILE */

@media (max-width: 850px) {
    #menuScreen {
        justify-content: flex-start;
        padding-top: 70px;
        padding-bottom: 50px;
    }

    .cards {
        max-width: 600px;
        grid-template-columns: 1fr;
        gap: 18px;
    }

    .site-card {
        min-height: 260px;
    }

    .header {
        margin-bottom: 35px;
    }
}

@media (max-width: 480px) {
    .screen {
        padding: 20px;
    }

    #menuScreen {
        padding-top: 45px;
        padding-bottom: 35px;
    }

    .header h1 {
        font-size: 39px;
        letter-spacing: 5px;
    }

    .password-box {
        padding: 35px 22px;
    }
}
</style>
</head>

<body>

<div class="background"></div>

<!-- PASSWORD SCREEN -->

<div class="screen" id="passwordScreen">

    <div class="password-box">
        <h1>SCHOOL</h1>
        <p>Enter the access password to continue</p>

        <form onsubmit="checkPassword(event)">
            <input
                type="password"
                id="passwordInput"
                placeholder="Enter password..."
                autocomplete="off"
            >

            <button type="submit">ENTER TERMINAL</button>
        </form>

        <div id="errorMessage"></div>
    </div>

</div>

<!-- WEBSITE MENU -->

<div class="screen hidden" id="menuScreen">

    <div class="header">
        <h1>School Terminal</h1>
        <p>Select a website to continue</p>
    </div>

    <div class="cards">

        <!-- MONKEYGG2 -->

        <button class="site-card" onclick="openWebsite('monkey')">

            <div class="card-icon">
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="100" cy="100" r="90" fill="#263c50"/>
                    <circle cx="100" cy="100" r="65" fill="#4e9ed1"/>
                    <circle cx="77" cy="83" r="12" fill="white"/>
                    <circle cx="123" cy="83" r="12" fill="white"/>
                    <circle cx="79" cy="85" r="5" fill="#17232e"/>
                    <circle cx="125" cy="85" r="5" fill="#17232e"/>
                    <path d="M72 119 Q100 148 128 119"
                          fill="none" stroke="white"
                          stroke-width="9" stroke-linecap="round"/>
                </svg>
            </div>

            <h2>MonkeyGG2</h2>

            <p>
                Explore the MonkeyGG2 website and its collection
                of games and other features.
            </p>

            <span class="card-label">Open website ↗</span>

        </button>

        <!-- CCPORTED -->

        <button class="site-card" onclick="openWebsite('ccported')">

            <div class="card-icon">
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="100" cy="100" r="90" fill="#243b36"/>
                    <rect x="40" y="45" width="120" height="110"
                          rx="20" fill="#63c9a5"/>
                    <path d="M78 76 L56 100 L78 124"
                          fill="none" stroke="white"
                          stroke-width="10" stroke-linecap="round"
                          stroke-linejoin="round"/>
                    <path d="M122 76 L144 100 L122 124"
                          fill="none" stroke="white"
                          stroke-width="10" stroke-linecap="round"
                          stroke-linejoin="round"/>
                    <path d="M108 67 L92 133"
                          fill="none" stroke="#d6fff0"
                          stroke-width="9" stroke-linecap="round"/>
                </svg>
            </div>

            <h2>CCPorted</h2>

            <p>
                Visit the CCPorted website and explore its
                collection of games and projects.
            </p>

            <span class="card-label">Open website ↗</span>

        </button>

        <!-- 3KH0 PROJECTS -->

        <button class="site-card" onclick="openWebsite('3kh0')">

            <div class="card-icon">
                <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="100" cy="100" r="90" fill="#25233b"/>
                    <rect x="43" y="43" width="114" height="114"
                          rx="15" fill="#8065c9"/>
                    <path d="M78 78 L57 100 L78 122"
                          fill="none" stroke="white"
                          stroke-width="10" stroke-linecap="round"
                          stroke-linejoin="round"/>
                    <path d="M122 78 L143 100 L122 122"
                          fill="none" stroke="white"
                          stroke-width="10" stroke-linecap="round"
                          stroke-linejoin="round"/>
                    <path d="M111 67 L89 133"
                          fill="none" stroke="#b9a5ff"
                          stroke-width="9" stroke-linecap="round"/>
                </svg>
            </div>

            <h2>3kh0 Projects</h2>

            <p>
                Explore the 3kh0 projects collection
                and discover more websites and projects.
            </p>

            <span class="card-label">Open website ↗</span>

        </button>

    </div>

    <div class="footer">
        SCHOOL TERMINAL • SELECT YOUR DESTINATION
    </div>

</div>

<!-- FADE OVERLAY -->

<div id="fadeOverlay"></div>

<script>

/* ==================================
   CONFIGURATION
================================== */

// Set to null to disable the password screen.
// Set to a string to enable password protection.

const PASSWORD = null;


/* ==================================
   INITIAL SCREEN
================================== */

document.addEventListener("DOMContentLoaded", () => {

    const passwordScreen = document.getElementById("passwordScreen");
    const menuScreen = document.getElementById("menuScreen");

    if (PASSWORD === null || PASSWORD === undefined || PASSWORD === "") {

        passwordScreen.classList.add("hidden");
        menuScreen.classList.remove("hidden");

    } else {

        passwordScreen.classList.remove("hidden");
        menuScreen.classList.add("hidden");

        document.getElementById("passwordInput").focus();

    }

});


/* ==================================
   PASSWORD CHECK
================================== */

function checkPassword(event) {

    event.preventDefault();

    if (PASSWORD === null || PASSWORD === undefined || PASSWORD === "") {
        return;
    }

    const input = document.getElementById("passwordInput");
    const error = document.getElementById("errorMessage");

    if (input.value === PASSWORD) {

        error.textContent = "";

        fadeTransition(() => {

            document.getElementById("passwordScreen")
                .classList.add("hidden");

            document.getElementById("menuScreen")
                .classList.remove("hidden");

        });

    } else {

        error.textContent = "Incorrect password. Please try again.";

        input.value = "";
        input.focus();

    }

}


/* ==================================
   OPEN WEBSITES IN NEW TAB
================================== */

function openWebsite(site) {

    let url = "";

    if (site === "monkey") {
        url = "https://monkeyg2.netlify.app/";
    }

    else if (site === "ccported") {
        url = "https://schoolported.netlify.app/";
    }

    else if (site === "3kh0") {
        url = "https://3kh0g.netlify.app/projects";
    }

    if (!url) return;

    window.open(url, "_blank", "noopener,noreferrer");

}


/* ==================================
   FADE TRANSITION
================================== */

function fadeTransition(callback) {

    const overlay = document.getElementById("fadeOverlay");

    overlay.classList.add("active");

    setTimeout(() => {

        callback();

        setTimeout(() => {
            overlay.classList.remove("active");
        }, 100);

    }, 450);

}

</script>

</body>
</html>
