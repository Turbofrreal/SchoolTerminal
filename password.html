<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Terminal | Access</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:20px;
background:radial-gradient(ellipse at 50% 45%,#151b22 0%,#080a0e 55%,#030405 100%);
color:#fff;font-family:Arial,Helvetica,sans-serif}
.box{width:100%;max-width:390px;text-align:center;padding:42px 35px;
border:1px solid rgba(255,255,255,.1);border-radius:18px;
background:rgba(18,21,26,.88);backdrop-filter:blur(18px);
box-shadow:0 20px 80px rgba(0,0,0,.5)}
h1{font-size:38px;font-weight:300;letter-spacing:5px;color:#b7f7e5;margin-bottom:12px}
p{color:#9299a3;font-size:14px;margin-bottom:30px}
input{width:100%;padding:15px;border:1px solid #343b43;border-radius:9px;
background:#101419;color:white;outline:none;font-size:15px;text-align:center}
input:focus{border-color:#9cebd5}
button{width:100%;margin-top:15px;padding:14px;border:0;border-radius:9px;
background:#b7f7e5;color:#07100d;font-weight:bold;font-size:15px;cursor:pointer}
#error{color:#ff7777;font-size:13px;margin-top:15px;min-height:16px}
</style>
</head>
<body>
<div class="box">
  <h1>SCHOOL</h1>
  <p>Enter the access password to continue</p>
  <form id="loginForm">
    <input id="passwordInput" type="password" placeholder="Enter password..."
           autocomplete="current-password" required>
    <button type="submit">ENTER TERMINAL</button>
  </form>
  <div id="error" role="status"></div>
</div>
<script>
/* CHANGE THIS to your chosen password. This is visible to anyone who inspects the page source. */
const PASSWORD = "schoolmoneybelike";

document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();
    const input = document.getElementById("passwordInput");
    const error = document.getElementById("error");

    if (input.value === PASSWORD) {
        localStorage.setItem("schoolTerminalPasswordPassed", "true");
        window.location.replace("/");
    } else {
        error.textContent = "Incorrect password. Please try again.";
        input.value = "";
        input.focus();
    }
});
</script>
</body>
</html>
